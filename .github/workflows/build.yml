# Tests and builds the release APK on every push to main and pull request.
# Releases come from scripts/release.sh.
#
# CI has no sts2.dll (a game file), so it ships the released compat pack
# (COMPAT=release), without the VFX pool patch.
#
# Release signing key, as repository secrets:
#   KEYSTORE_BASE64     base64 of the keystore file
#   KEYSTORE_PASSWORD   its password
#   KEY_ALIAS           the key's alias
#   KEY_PASSWORD        the key's password
name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NDK_VERSION: 28.1.13356709
  CMAKE_VERSION: 3.22.1
  DEX2JAR_VERSION: '2.4'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - uses: gradle/actions/setup-gradle@v4

      # The SDK parts build.gradle.kts pins.
      - name: Android SDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" \
            "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" > /dev/null

      # make-runtime.sh calls d2j-dex2jar (Homebrew's name on macOS).
      - name: dex2jar
        run: |
          curl -fsSL -o "$RUNNER_TEMP/d2j.zip" \
            "https://github.com/pxb1988/dex2jar/releases/download/v$DEX2JAR_VERSION/dex-tools-v$DEX2JAR_VERSION.zip"
          unzip -q "$RUNNER_TEMP/d2j.zip" -d "$RUNNER_TEMP/d2j"
          script="$(find "$RUNNER_TEMP/d2j" -name d2j-dex2jar.sh)"
          chmod +x "$(dirname "$script")"/*.sh
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec "%s" "$@"\n' "$script" > "$RUNNER_TEMP/bin/d2j-dex2jar"
          chmod +x "$RUNNER_TEMP/bin/d2j-dex2jar"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # The Sts2MobileLauncher APK and Godot AAR make-runtime.sh downloads.
      - uses: actions/cache@v4
        with:
          path: .cache/runtime
          key: runtime-${{ hashFiles('Makefile', 'tools/runtime/make-runtime.sh') }}

      # Without the secret (pull requests from forks), a throwaway debug key.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::warning::no KEYSTORE_BASE64 secret: signed with a throwaway debug key"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "STS2DS_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Test
        run: make test

      - name: Build APK
        env:
          STS2DS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          STS2DS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STS2DS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: make apk COMPAT=release

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk
